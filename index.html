/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}


</style>
</head>

cilindro; il combustibile si accende da solo nell'aria molto compressa (",0],["autoaccensione",1],[").",0]]},{t:"li",r:[["Modo di funzionamento",1],[" \u2014 ",0],["4 tempi",0],[": ",0],["Ricambio dei gas a circuito chiuso, con valvole. Un ciclo = ",0],["4 corse",1],[" del pistone = ",0],["2 giri",1],[" dell'albero motore.",0]]},{t:"li",r:[["2 tempi",0],[": ",0],["Ricambio dei gas a circuito aperto. Un ciclo = 2 corse = 1 giro.",0]]},{t:"li",r:[["Disposizione dei cilindri",1],[" \u2014 ",0],["In linea, a V, boxer, VR",0],[": ",0],["Vedi lo schema qui sotto.",0]]},{t:"li",r:[["Movimento dei pistoni",1],[" \u2014 ",0],["Alternato, rotativo",0],[": ",0],["Il pistone va avanti e indietro (alternato) oppure ruota (motore rotativo).",0]]},{t:"li",r:[["Raffreddamento",1],[" \u2014 ",0],["A liquido, ad aria",0],[": ",0],["Il calore \xE8 portato via da un liquido refrigerante o direttamente dall'aria che lambisce le alette.",0]]}]},{title:"1.2 Il motore a ciclo Otto",blocks:[{t:"p",r:[["Il motore a ciclo Otto \xE8 una ",0],["macchina di potenza a combustione",1],[". Bruciando il carburante trasforma l'",0],["energia chimica",1],[" in ",0],["energia termica",1],[" (calore) e poi, attraverso il moto di uno o pi\xF9 pistoni, in ",0],["energia meccanica",1],[" disponibile sull'albero motore.",0]]},{t:"f",r:[["energia chimica (carburante) \u2192 energia termica (combustione) \u2192 energia meccanica (albero motore)",0]]}]},{title:"1.3 Struttura del motore",blocks:[{t:"p",r:[["Il motore \xE8 formato da ",0],["quattro gruppi costruttivi",1],[" principali, a cui si aggiungono i dispositivi ausiliari.",0]]},{t:"li",r:[["Corpo motore",1],[" (monoblocco)",0],[" \u2014 Componenti: ",0],["Coperchio valvole, testata, cilindri (blocco cilindri), basamento, coppa dell'olio",0],[". Nel GX160: ",0],["Un solo cilindro con canna in ghisa e alette; coperchio dei bilancieri",0]]},{t:"li",r:[["Manovellismo",1],[" \u2014 Componenti: ",0],["Pistone, biella, albero a manovelle (albero motore)",0],[". Nel GX160: ",0],["Pistone con 3 fasce, biella con paletta sbattitore, albero con contrappeso",0]]},{t:"li",r:[["Sistema di distribuzione",1],[" \u2014 Componenti: ",0],["Valvole, molle valvola, bilancieri, albero dei bilancieri, albero a camme, ingranaggi di comando, catena o cinghia di comando",0],[". Nel GX160: ",0],["Distribuzione ",0],["OHV",1],[": albero a camme nel basamento comandato da ingranaggi, punterie, aste e bilancieri",0]]},{t:"li",r:[["Sistema di miscelazione",1],[" \u2014 Componenti: ",0],["Impianto di iniezione, collettore di aspirazione",0],[". Nel GX160: ",0],["Carburatore e condotto di aspirazione",0]]},{t:"li",r:[["Dispositivi ausiliari",1],[" \u2014 Componenti: ",0],["Impianti di accensione, lubrificazione, raffreddamento, scarico, sovralimentazione",0],[". Nel GX160: ",0],["Accensione a magnete, lubrificazione a sbattimento, raffreddamento ad aria, marmitta; nessuna sovralimentazione",0]]}]},{title:"1.4 Funzionamento: le 4 fasi del ciclo di lavoro",blocks:[{t:"p",r:[["Le 4 fasi del ciclo sono ",0],["aspirazione, compressione, espansione e scarico",1],[". Un ciclo di lavoro si svolge in ",0],["2 giri",1],[" dell'albero motore, cio\xE8 ",0],["720\xB0 di angolo di manovella",1],[" (\xB0AM).",0]]},{t:"p",r:[["Le sigle usate: ",0],["VA",1],[" valvola di aspirazione, ",0],["VS",1],[" valvola di scarico, ",0],["Aa/Ac",1],[" apertura e chiusura della VA, ",0],["Sa/Sc",1],[" apertura e chiusura della VS, ",0],["PMS/PMI",1],[" punto morto superiore e inferiore.",0]]},{t:"h3",r:[["1\xAA fase \xB7 aspirazione",1]]},{t:"p",r:[["Il pistone scende e il volume nel cilindro aumenta: si crea una ",0],["depressione di \u22120,1 \xF7 \u22120,3 bar",1],[" rispetto all'esterno. Nel motore a iniezione nel condotto entra la miscela aria-carburante; con l'iniezione diretta entra solo aria. Per riempire al massimo il cilindro la VA si apre ",0],["10 \xF7 45 \xB0AM prima del PMS",1],[" e si chiude ",0],["35 \xF7 90 \xB0AM dopo il PMI",1],[".",0]]},{t:"h3",r:[["2\xAA fase \xB7 compressione",1]]},{t:"p",r:[["Il pistone sale con le due valvole chiuse. Il volume si riduce ",0],["da 7 a 18 volte",1],[" e la pressione di compressione sale fino a circa ",0],["18 bar",1],["; i gas si scaldano a ",0],["400 \xF7 500 \xB0C",1],[". Con l'iniezione diretta e in certe condizioni (bassi regimi, fino a circa 3000 giri/min, e bassa coppia) si comprime solo aria e il carburante \xE8 iniettato poco prima dell'accensione.",0]]},{t:"h3",r:[["3\xAA fase \xB7 espansione",1]]},{t:"p",r:[["La combustione inizia quando scocca la ",0],["scintilla",1],[". Tra scintilla e combustione completa passa circa ",0],["1/1000 s",1],[". Per questo, secondo il regime, la scintilla scocca ",0],["da 0\xB0 a 40\xB0 prima del PMS",1],[": cos\xEC la pressione massima di combustione, ",0],["30 \xF7 60 bar",1],[", si ha ",0],["subito dopo il PMS (4 \xF7 10 \xB0AM)",1],[". I gas caldi si espandono: l'energia termica diventa energia meccanica.",0]]},{t:"h3",r:[["4\xAA fase \xB7 scarico",1]]},{t:"p",r:[["La VS si apre ",0],["40 \xF7 90 \xB0AM prima del PMI",1],[", per favorire l'uscita dei gas e alleggerire il pistone. I gas escono a ",0],["3 \xF7 5 bar",1],[", alla velocit\xE0 del suono e a circa ",0],["900 \xB0C",1],[". Il pistone risalendo spinge fuori i gas rimasti. La VS si chiude ",0],["solo dopo il PMS",1],[", quando la VA \xE8 gi\xE0 aperta: questo ",0],["incrocio valvole",1],[" sfrutta l'inerzia dei gas, migliora lo svuotamento, raffredda la camera e aiuta il riempimento.",0]]}]},{title:"1.5 Caratteristiche del motore Otto",blocks:[{t:"li",r:[["Carburante:",1],[" benzina oppure gas.",0]]},{t:"li",r:[["Miscelazione esterna:",1],[" la miscela aria-carburante si forma nel collettore di aspirazione, cio\xE8 fuori dal cilindro.",0]]},{t:"li",r:[["Miscelazione interna:",1],[" durante l'aspirazione entra solo aria e il carburante \xE8 iniettato direttamente nel cilindro, in aspirazione oppure in compressione.",0]]},{t:"li",r:[["Accensione comandata",1],[" da una fonte esterna (la candela).",0]]},{t:"li",r:[["Combustione a volume costante:",1],[" la combustione \xE8 cos\xEC rapida che la pressione sale mentre il volume resta praticamente costante.",0]]},{t:"li",r:[["Regolazione della quantit\xE0:",1],[" la potenza si regola variando la quantit\xE0 di miscela aspirata con la valvola a farfalla (stato di carico).",0]]}]},{title:"1.6 Il processo di combustione",blocks:[{t:"p",r:[["La combustione avviene in un tempo brevissimo e termina subito dopo il PMS. In questo tempo le molecole di carburante devono trovare l'ossigeno necessario, che viene dall'aria aspirata. L'aria contiene circa il ",0],["20 % di ossigeno",1],[", quindi per bruciare il carburante serve molta aria.",0]]},{t:"p",r:[["La quantit\xE0 minima di aria per bruciare completamente 1 kg di benzina \xE8 il ",0],["fabbisogno teorico di aria",1],[":",0]]},{t:"f",r:[["14,7 kg di aria per 1 kg di benzina (rapporto stechiometrico 14,7 : 1)",0]]},{t:"p",r:[["Con una densit\xE0 dell'aria \u03C1 = 1,29 kg/m\xB3 corrispondono 14,7 / 1,29 \u2248 ",0],["11,4 m\xB3",1],[" di aria.",0]]},{t:"h3",r:[["Combustione completa",0]]},{t:"p",r:[["L'energia chimica del carburante si trasforma in energia termica. Il carbonio brucia formando anidride carbonica, l'idrogeno formando vapore acqueo:",0]]},{t:"f",r:[["C + O\u2082 \u2192 CO\u2082 + energia termica",0]]},{t:"f",r:[["2 H\u2082 + O\u2082 \u2192 2 H\u2082O + energia termica",0]]},{t:"p",r:[["L'azoto dell'aria non partecipa alla combustione, ma alle alte pressioni e temperature in camera forma ",0],["ossidi di azoto",1],[" nocivi (NOx).",0]]},{t:"h3",r:[["Combustione incompleta",0]]},{t:"p",r:[["Se per 1 kg di benzina ci sono solo ",0],["13 kg di aria",1],[" (1 : 13) la miscela \xE8 ",0],["grassa (ricca)",1],[": manca ossigeno, una parte del carbonio brucia in modo incompleto e si forma ",0],["monossido di carbonio (CO)",1],[", che \xE8 velenoso:",0]]},{t:"f",r:[["2 C + O\u2082 \u2192 2 CO + calore",0]]},{t:"p",r:[["Se invece ci sono ",0],["16 kg di aria",1],[" (1 : 16) la miscela \xE8 ",0],["magra",1],[". Anche in questo caso la combustione pu\xF2 essere incompleta: il carburante pu\xF2 non evaporare in tempo se il volume interno del cilindro non viene raffreddato abbastanza, e il motore pu\xF2 surriscaldarsi.",0]]}]},{title:"1.7 Combustione con battito in testa",blocks:[{t:"p",r:[["Un motore Otto ",0],["batte in testa",1],[" quando, insieme alla scintilla della candela, si verifica anche un'",0],["autoaccensione",1],[" della miscela non ancora bruciata. Si formano pi\xF9 fronti di fiamma che si scontrano: la combustione diventa violenta, con velocit\xE0 di ",0],["300 \xF7 500 m/s",1],[" e pressioni molto elevate. Il rumore metallico (\u201Cpicchiettio\u201D) nasce dalle onde d'urto, che fanno vibrare le parti del motore.",0]]},{t:"p",r:[["Conseguenze:",1],[" carichi meccanici e termici molto elevati sul manovellismo e forte riduzione della potenza.",0]]},{t:"h3",r:[["Cause",0]]},{t:"li",r:[["carburanti non idonei;",0]]},{t:"li",r:[["accensione troppo anticipata;",0]]},{t:"li",r:[["ripartizione irregolare della miscela nel cilindro;",0]]},{t:"li",r:[["cattiva cessione di calore, per depositi carboniosi o difetti del raffreddamento;",0]]},{t:"li",r:[["rapporto di compressione troppo alto, per esempio con una guarnizione della testata pi\xF9 sottile dell'originale.",0]]},{t:"h3",r:[["Battito in fase di accelerazione",0]]},{t:"p",r:[["Si presenta accelerando a pieno carico a basso regime. \xC8 dovuto a un carburante con ",0],["numero di ottano (RON)",1],[" insufficiente o a una scorretta regolazione del punto di accensione.",0]]},{t:"h3",r:[["Battito alla velocit\xE0 massima",0]]},{t:"p",r:[["Si presenta ad alti regimi e a pieno carico. \xC8 dovuto a un carburante con RON insufficiente, oppure con una grande differenza tra RON e MON (sensitivity). \xC8 pericoloso perch\xE9 spesso non si sente: pu\xF2 surriscaldare il motore e causare bruciature delle valvole, della guarnizione della testata e del cielo del pi
